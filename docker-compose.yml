services:
  db:
    image: postgres:16-alpine
    container_name: pedidomesa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pedidomesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pedidomesa}
      POSTGRES_DB: ${POSTGRES_DB:-pedidomesa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pedidomesa} -d ${POSTGRES_DB:-pedidomesa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: pedidomesa-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pedidomesa:pedidomesa@db:5432/pedidomesa}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_* é inlinado no bundle do navegador em build-time pelo Next.js —
        # setar isso em "environment:" (runtime) NÃO tem efeito. Precisa vir como build arg.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: pedidomesa-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
